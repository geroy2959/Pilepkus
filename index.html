<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071329">
<title>Поле Чудес 2.0</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#050b18;--panel:#0a1934;--blue:#087cff;--cyan:#00d9ff;--gold:#ffc94a;--text:#f4f7ff;--muted:#9fb4d4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#12356b 0,#071329 46%,#030712 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:850px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand{font-size:21px;font-weight:900;letter-spacing:.2px}.brand span{color:var(--gold)}.balance{border:1px solid #23558a;background:#0b2145;padding:9px 12px;border-radius:14px;font-weight:800;color:var(--gold)}
.card{background:linear-gradient(145deg,rgba(13,37,78,.96),rgba(5,15,34,.98));border:1px solid #164c8a;box-shadow:0 8px 30px #0007;border-radius:20px;padding:15px;margin-bottom:12px}
.stage{position:relative;overflow:hidden;text-align:center;background:linear-gradient(#0b2b5a,#071329);border:1px solid #2874c9}
.host{font-size:12px;color:#b5d6ff;letter-spacing:2px}.puzzle{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:14px auto 10px}.tile{width:clamp(23px,7vw,43px);height:clamp(34px,10vw,52px);display:grid;place-items:center;border:1px solid #2f83d6;border-radius:6px;background:linear-gradient(#174c91,#0b2852);font-size:clamp(17px,5vw,26px);font-weight:900;color:white}.tile.open{background:linear-gradient(#fff0b0,#ffca4a);color:#14223a;border-color:#ffe28b}.hint{font-size:13px;color:#bad4f5;margin-top:6px}
.wheel-area{display:flex;justify-content:center;padding:6px 0 14px}.wheelbox{position:relative;width:min(82vw,360px);aspect-ratio:1}.wheel{width:100%;height:100%;border-radius:50%;border:7px solid #4aaeff;box-shadow:0 0 0 3px #06152e,0 0 24px #008cff99;transition:transform 4s cubic-bezier(.12,.72,.12,1);background:conic-gradient(#f7faff 0 30deg,#10284d 30deg 60deg,#f7faff 60deg 90deg,#10284d 90deg 120deg,#f7faff 120deg 150deg,#10284d 150deg 180deg,#f7faff 180deg 210deg,#10284d 210deg 240deg,#f7faff 240deg 270deg,#10284d 270deg 300deg,#f7faff 300deg 330deg,#10284d 330deg 360deg);position:relative}
.wheel-labels{position:absolute;inset:0;border-radius:50%;pointer-events:none}.wl{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:12px;font-weight:900;color:#09162a}
.pointer{position:absolute;z-index:2;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--gold);filter:drop-shadow(0 2px 3px #000)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffd66a,#d88b10 65%,#7a4300);border:4px solid #fff0a6;box-shadow:0 0 15px #ffb82d}
.btn{width:100%;border:0;border-radius:15px;padding:15px 12px;background:linear-gradient(100deg,#087cff,#00aaff);color:white;font-size:17px;font-weight:900;box-shadow:0 5px 0 #034b9b;cursor:pointer}.btn:disabled{opacity:.5}.btn.secondary{background:linear-gradient(100deg,#17426f,#10294b);box-shadow:none;border:1px solid #2a6098}
.status{min-height:26px;text-align:center;color:#ffe18a;font-weight:700;margin:10px 0}
.letters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.letter{padding:11px 0;border-radius:9px;border:1px solid #2874bd;background:linear-gradient(#153d72,#0b2346);color:#fff;font-weight:800;font-size:16px}.letter:disabled{opacity:.3}.letter.good{background:#1c865b;border-color:#4ee0a2}.letter.bad{background:#5a2632;border-color:#a94c60}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#07152b;border:1px solid #173e6d;border-radius:13px;padding:11px}.stat small{color:var(--muted)}.stat b{display:block;font-size:20px;color:var(--gold);margin-top:3px}
.footer{font-size:11px;text-align:center;color:#7e9abc;padding:8px}
@media(min-width:650px){.gamegrid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.gamegrid .card{margin-bottom:0}.letters{grid-template-columns:repeat(8,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
 <header class="top"><div class="brand">🎡 Поле <span>Чудес</span> 2.0</div><div class="balance">🪙 <span id="scoreTop">0</span></div></header>
 <section class="card stage">
  <div class="host">★ ТВОЯ ИГРА — ТВОИ ПРИЗЫ ★</div>
  <div class="puzzle" id="puzzle"></div>
  <div class="hint" id="hint">Подсказка появится здесь</div>
 </section>
 <div class="gamegrid">
  <section class="card">
   <div class="wheel-area"><div class="wheelbox"><div class="pointer"></div><div class="wheel" id="wheel"></div><div class="hub"></div></div></div>
   <button class="btn" id="spin">🎡 Крутить барабан</button>
   <div class="status" id="status">Нажми на барабан, чтобы начать!</div>
   <div class="row"><div class="stat"><small>Раунд</small><b id="round">1 / 3</b></div><div class="stat"><small>Очки за ход</small><b id="turnPoints">0</b></div></div>
  </section>
  <section class="card">
   <div style="font-weight:900;margin-bottom:10px">🔠 Выбери букву</div>
   <div class="letters" id="letters"></div>
   <div style="height:12px"></div>
   <button class="btn secondary" id="newgame">↻ Новая игра</button>
   <div style="height:12px"></div>
   <div class="row"><div class="stat"><small>Твой баланс</small><b>🪙 <span id="score">0</span></b></div><div class="stat"><small>Слово</small><b id="wordCount">0 / 0</b></div></div>
  </section>
 </div>
 <div class="footer">Личная мини-игра • Результат хранится в текущем запуске Web App</div>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#071329");tg.setBackgroundColor("#050b18")}catch(e){}}
const alphabet="АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ".split("");
const puzzles=[
 {w:"КАРАМЕЛЬ",h:"Сладкое лакомство"},
 {w:"ТЕЛЕВИЗОР",h:"Показывает фильмы и передачи"},
 {w:"ПРИКЛЮЧЕНИЕ",h:"Захватывающее событие"},
 {w:"КОСМОНАВТ",h:"Человек, который летает в космос"},
 {w:"ПИРАМИДА",h:"Геометрическая фигура и древнее сооружение"},
 {w:"АПЕЛЬСИН",h:"Оранжевый цитрусовый фрукт"},
 {w:"БИБЛИОТЕКА",h:"Место, где хранятся книги"},
 {w:"МОРОЖЕНОЕ",h:"Холодный десерт"}
];
const sectors=[["100",100],["200",200],["300",300],["500",500],["x2",2],["Приз",750],["0",0],["Плюс",400],["100",100],["Шанс",250],["Банкрот",-1],["200",200]];
let puzzle, guessed, score=0, turn=0, rounds=1, spinValue=0, spinning=false, finished=false;
const $=id=>document.getElementById(id);
function choosePuzzle(){return puzzles[Math.floor(Math.random()*puzzles.length)]}
function setup(){puzzle=choosePuzzle();guessed=new Set();turn=0;spinValue=0;spinning=false;finished=false;$("hint").textContent="Подсказка: "+puzzle.h;$("status").textContent="Крути барабан и выбирай букву!";$("turnPoints").textContent="0";$("spin").disabled=false;renderPuzzle();renderLetters();updateStats();}
function renderPuzzle(){$("puzzle").innerHTML="";for(const ch of puzzle.w){const d=document.createElement("div");d.className="tile"+(guessed.has(ch)?" open":"");d.textContent=guessed.has(ch)?ch:"";$("puzzle").appendChild(d)}$("wordCount").textContent=[...new Set(puzzle.w.split(""))].filter(c=>guessed.has(c)).length+" / "+[...new Set(puzzle.w.split(""))].length}
function renderLetters(){$("letters").innerHTML="";alphabet.forEach(ch=>{const b=document.createElement("button");b.className="letter";b.textContent=ch;b.disabled=guessed.has(ch)||finished;b.onclick=()=>pickLetter(ch,b);$("letters").appendChild(b)})}
function updateStats(){$("score").textContent=score;$("scoreTop").textContent=score;$("round").textContent=rounds+" / 3"}
function spin(){if(spinning||finished)return;spinning=true;$("spin").disabled=true;$("status").textContent="Барабан крутится…";const idx=Math.floor(Math.random()*sectors.length);const item=sectors[idx];const current=((spinValue%360)+360)%360;const target=spinValue+1440+(360-idx*30-current+360)%360;spinValue=target;$("wheel").style.transform=`rotate(${target}deg)`;setTimeout(()=>{spinning=false;turn++;if(item[1]===-1){score=0;$("status").textContent="💥 Банкрот! Баланс обнулён. Выбери новую букву."; $("turnPoints").textContent="0"}else{const points=item[1]===2?Math.max(100,Number($("turnPoints").textContent)||100)*2:item[1];$("turnPoints").textContent=points;$("status").textContent=`🎯 Выпало: ${item[0]}. Выбирай букву!`;spinValue=target;} $("spin").disabled=false;updateStats();},4100)}
function pickLetter(ch,button){if(finished||spinning||guessed.has(ch))return;guessed.add(ch);const count=puzzle.w.split("").filter(c=>c===ch).length;button.disabled=true;button.classList.add(count?"good":"bad");if(count){const pts=Number($("turnPoints").textContent)||100;score+=pts*count;$("status").textContent=`🔥 Есть буква «${ch}»! +${pts*count} очков`;}else{$("status").textContent=`Мимо! Буквы «${ch}» нет.`}renderPuzzle();updateStats();if([...new Set(puzzle.w.split(""))].every(c=>guessed.has(c))){finished=true;$("status").textContent="🏆 Слово открыто! Ты победил!";$("spin").disabled=true;}else if(turn>=3){$("status").textContent="Раунд завершён. Нажми «Новая игра».";}$("spin").disabled=finished}
$("spin").addEventListener("click",spin);$("newgame").addEventListener("click",()=>{rounds=rounds>=3?1:rounds+1;setup()});
setup();
</script>
</body></html>
